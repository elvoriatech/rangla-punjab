<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="646"
     viewBox="0 0 1024 646" role="img"
     aria-label="Gift card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1a0e" />
      <stop offset="1" stop-color="#120a04" />
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c15c" />
      <stop offset="0.45" stop-color="#e8c15c" />
      <stop offset="1" stop-color="#e8c15c" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#e8c15c" stop-opacity="0.18" />
      <stop offset="1" stop-color="#e8c15c" stop-opacity="0" />
    </radialGradient>
    
    <pattern id="jali" width="64" height="64" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#e8c15c" stroke-width="2"
         stroke-opacity="0.3">
        <path d="M32 0 L64 32 L32 64 L0 32 Z" />
        <circle cx="32" cy="32" r="11" />
        <path d="M0 0 L8 8 M64 0 L56 8 M0 64 L8 56 M64 64 L56 56" />
      </g>
    </pattern>
  </defs>

  <rect width="1024" height="646" rx="44" fill="url(#bg)" />
  <rect width="1024" height="646" rx="44" fill="url(#jali)" />
  <rect width="1024" height="646" rx="44" fill="url(#glow)" />

  <!-- Double rule frame: heavy outer, hairline inner. -->
  <rect x="34" y="34" width="956" height="578"
        rx="26" fill="none" stroke="url(#foil)" stroke-width="6" />
  <rect x="52" y="52" width="920" height="542"
        rx="18" fill="none" stroke="#e8c15c" stroke-width="1.5" stroke-opacity="0.65" />

  <!-- Mughal arch, open at the base so it reads as a doorway. -->
  <path d="M380 491
           L380 299
           Q380 191 512 155
           Q644 191 644 299
           L644 491"
        fill="none" stroke="url(#foil)" stroke-width="4" stroke-opacity="0.9" />

  <circle cx="512" cy="313" r="30" fill="none"
      stroke="#e8c15c"
      stroke-width="5" stroke-opacity="1.00" />
      <circle cx="512" cy="313" r="47" fill="none"
      stroke="#e8c15c"
      stroke-width="2.5" stroke-opacity="0.82" />
      <circle cx="512" cy="313" r="64" fill="none"
      stroke="#e8c15c"
      stroke-width="2.5" stroke-opacity="0.64" />
      <circle cx="512" cy="313" r="81" fill="none"
      stroke="#e8c15c"
      stroke-width="2.5" stroke-opacity="0.46" />
      <polygon points="512.0,291.0 515.4,304.7 527.6,297.4 520.3,309.6 534.0,313.0 520.3,316.4 527.6,328.6 515.4,321.3 512.0,335.0 508.6,321.3 496.4,328.6 503.7,316.4 490.0,313.0 503.7,309.6 496.4,297.4 508.6,304.7" fill="#e8c15c" fill-opacity="0.9" />

  <!-- Corner flourishes. -->
  <path d="M64 104 L64 64 L104 64"
          fill="none" stroke="#e8c15c" stroke-width="3" stroke-opacity="0.8"
          stroke-linecap="round" />
  <path d="M960 104 L960 64 L920 64"
          fill="none" stroke="#e8c15c" stroke-width="3" stroke-opacity="0.8"
          stroke-linecap="round" />
  <path d="M64 542 L64 582 L104 582"
          fill="none" stroke="#e8c15c" stroke-width="3" stroke-opacity="0.8"
          stroke-linecap="round" />
  <path d="M960 542 L960 582 L920 582"
          fill="none" stroke="#e8c15c" stroke-width="3" stroke-opacity="0.8"
          stroke-linecap="round" />
</svg>