# resto — production compose for the APP VPS.
#
# Topology: PostgreSQL is REMOTE (resto_database @ ${DB_HOST} private IP).
# Deliberately not a container here. Single restaurant,
# one tenant, RLS disabled: the app connects DIRECTLY to the remote DB
# as the owner role, no connection pooler in between.
# This file runs only the stateless/replaceable pieces:
#
#   caddy     :80/:443  TLS origin behind Cloudflare, proxies to app
#   app       (internal) Next.js standalone image → remote Postgres
#   redis     (internal) rate limits, webhook idempotency
#
# Images: stored on the app's own disk under public/uploads (mounted as
# the `uploads` volume, below) and resized by the /img route — no object
# store, no imgproxy. Back up that volume. Resized variants are cached
# on the separate `image_cache` volume (regenerable; do not back up).
#
# Secrets/config come from ../prod.env (copy prod.env.template, fill in).
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file prod.env up -d

# Project name = Docker Compose's identity for the whole stack:
# containers, network and volumes are all namespaced by it. It was
# `elvoria-prod`, which is the SAME name the live Guesto stack uses —
# so running this file on a host where Guesto is deployed would not
# create a second stack, it would reconcile Guesto's: recreating its
# app/caddy/redis with Rangla's config (taking Guesto down) and
# treating its worker/pgbouncer/imgproxy as orphans.
#
# Renaming also keeps the volumes apart. `elvoria-prod_uploads` holds
# Guesto's customer images; Rangla must never mount it.
name: rangla-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    depends_on:
      - app

  app:
    image: ${APP_IMAGE:-resto-app:latest}
    restart: unless-stopped
    env_file:
      - ../prod.env
    environment:
      NODE_ENV: production
      # Single restaurant, RLS disabled: the app connects DIRECTLY to the
      # remote managed Postgres as the owner role. Same URL for runtime,
      # migrations, and shadow DB — there is no pooler and no separate
      # least-privilege role to distinguish.
      APP_DATABASE_URL: postgresql://${DB_OWNER_USER:-resto_user}:${DB_OWNER_PASSWORD}@${DB_HOST}:5432/${DB_NAME:-resto_database}?schema=public
      DATABASE_URL: postgresql://${DB_OWNER_USER:-resto_user}:${DB_OWNER_PASSWORD}@${DB_HOST}:5432/${DB_NAME:-resto_database}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    # Uploaded images persist here across redeploys — BACK THIS UP.
    # image_cache holds sharp's resized variants: derived data, its own
    # volume so it survives redeploys (staying warm) while staying OUT
    # of the backup set. Safe to delete at any time — the next request
    # re-encodes. Do NOT back it up.
    volumes:
      - uploads:/app/public/uploads
      - image_cache:/app/.image-cache
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Live container logs in the browser (app, caddy, redis) — for spotting a
  # failing order or webhook without SSH. Opt-in: set COMPOSE_PROFILES=logs
  # plus DOZZLE_USER / DOZZLE_PASSWORD_SHA256 in prod.env; deploy.sh writes
  # the users file from those. Reached at https://<domain>/logs behind
  # Dozzle's own login. Read-only socket: it can watch, never control.
  dozzle:
    image: amir20/dozzle:latest
    profiles: ["logs"]
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle-users.yml:/data/users.yml:ro
    environment:
      DOZZLE_BASE: /logs
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_ENABLE_ACTIONS: "false"
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  uploads:
  image_cache:
